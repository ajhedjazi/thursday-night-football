<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking successful</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Payment received</h1>
      <p id="success-copy">Your payment went through.</p>
      <p id="success-detail">We are confirming your booking now.</p>
      <p><a href="/">Back to booking page</a></p>
    </section>
  </main>

  <script>
    const successCopyEl = document.getElementById("success-copy");
    const successDetailEl = document.getElementById("success-detail");

    async function confirmBooking() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");

      if (!sessionId) {
        successDetailEl.textContent = "Payment completed, but the booking reference was missing.";
        return;
      }

      try {
        const res = await fetch("/api/checkout/confirm", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ sessionId })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || "Could not confirm your booking.");
        }

        successCopyEl.textContent = "Your payment and booking have been confirmed.";
        successDetailEl.textContent = data.inserted
          ? "Your place is saved and the availability has been updated."
          : "Your booking was already confirmed, so nothing was duplicated.";
      } catch (error) {
        successDetailEl.textContent = error.message || "Could not confirm your booking automatically.";
      }
    }

    confirmBooking();
  </script>
</body>
</html>
